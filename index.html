<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Юрий Болдырев — Unity-разработчик · гейм-дизайнер</title>
  <meta name="description" content="Unity-разработчик и гейм-дизайнер, 7+ лет в геймдеве, основатель XABAR. Собираю команду для XABAR — кроссплатформенного иммерсивного шутера.">
  <meta property="og:title" content="Юрий Болдырев — Unity-разработчик · гейм-дизайнер">
  <meta property="og:description" content="7+ лет в геймдеве. Собираю команду для XABAR — кроссплатформенного иммерсивного шутера.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>.skip{position:absolute;left:-9999px}</style>
  <script>
    // Тема ставится до отрисовки, чтобы не было «вспышки» светлой темы.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="#top" aria-label="Наверх">
        <img class="brand__mark" src="assets/img/icons/avatar.webp" alt="" width="34" height="34">
        <span class="brand__name" data-bind="person.name"></span>
      </a>
      <nav class="nav" aria-label="Разделы">
        <a href="#projects" data-bind="ui.nav.projects"></a>
        <a href="#skills" data-bind="ui.nav.skills"></a>
        <a href="#path" data-bind="ui.nav.path"></a>
        <a href="#collab" data-bind="ui.nav.collab"></a>
        <a href="#contact" data-bind="ui.nav.contact"></a>
      </nav>
      <div class="controls">
        <button class="ctrl" id="langBtn" type="button"></button>
        <button class="ctrl ctrl--icon" id="themeBtn" type="button">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top"></section>
    <section class="section wrap" id="projects"></section>
    <section class="section wrap" id="skills"></section>
    <section class="section wrap" id="tools"></section>
    <section class="section wrap" id="path"></section>
    <section class="section wrap" id="collab"></section>
    <section class="section wrap" id="contact"></section>
  </main>

  <footer class="footer wrap" id="footer"></footer>

  <dialog class="lightbox" id="lightbox">
    <img class="lightbox__img" alt="">
    <button class="lightbox__btn lightbox__close" type="button" data-lb="close">✕</button>
    <button class="lightbox__btn lightbox__prev" type="button" data-lb="prev">‹</button>
    <button class="lightbox__btn lightbox__next" type="button" data-lb="next">›</button>
    <p class="lightbox__count"></p>
  </dialog>

  <noscript><p class="wrap">Для отображения сайта включите JavaScript. / Please enable JavaScript.</p></noscript>

  <script src="data/content.js"></script>
  <script src="assets/js/tool-icons.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Если открыт один index.html без папок assets/ и data/ (например, файл переслан на телефон),
    // вместо пустой страницы объясняем, что не так.
    if (!window.CONTENT) {
      document.getElementById('main').innerHTML =
        '<p style="max-width:36em;margin:2em auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">' +
        'Не удалось загрузить файлы сайта. Откройте сайт по ссылке или всю папку проекта целиком, а не один index.html.<br>' +
        'Site files failed to load. Open the site via its link, not a standalone index.html.</p>';
    }
  </script>
</body>
</html>
